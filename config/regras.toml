# Regras da carteira. São conferidas POR CÓDIGO (não por opinião do modelo).
# Ajuste os números ao seu perfil. Regra ignorada = nota zero no boletim (fase 3).

[carteira]
teto_posicao_pct = 25      # nenhuma posição acima disso do patrimônio
piso_posicao_pct = 3       # posição abaixo disso não vale o custo de acompanhar
teto_setor_pct = 40        # soma por setor
caixa_minimo_pct = 5

[alvo]
alerta_proximidade_pct = 3     # avisa quando faltar menos que isso para o alvo
realizar_em_pct_do_alvo = 90   # a 90% do alvo exige decisão de realização registrada
validade_decisao_dias = 7      # uma decisão de realização vale por quantos dias

[stop]
exige_decisao_registrada = true   # stop acionado sem decisão registrada = violação
validade_decisao_dias = 5         # decisão de stop (manter/sair) vale por N dias; depois, decidir de novo

[operacoes]
exige_tese = true          # toda compra/venda precisa de tese_id, gatilho e horizonte
max_ordens_semana = 8      # acima disso, alerta de excesso de giro

[vigilancia]
janela_inicio = "09:45"
janela_fim = "18:15"
movimento_sigma = 2.0          # alerta se o movimento do dia passar de N desvios-padrão
sigma_padrao_pct = 1.8         # usado enquanto não há 20 fechamentos de histórico
fonte_congelada_min = 30       # cotação mais velha que isso, em pregão = fonte congelada
divergencia_max_pct = 0.5      # duas fontes divergindo mais que isso = não confiar

[coleta]
tolerancia_fontes_pct = 0.5    # no fechamento, fontes devem bater dentro disso

[mesa]
# Prazo, em dias úteis, para registrar a decisão de cada pendência. 0 = no mesmo dia.
padrao_dias_uteis = 2
stop_sem_decisao = 0
stop_intradiario = 0
realizacao_sem_decisao = 2
piso_posicao = 5
