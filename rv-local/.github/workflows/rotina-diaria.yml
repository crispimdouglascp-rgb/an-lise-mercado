name: rotina-diaria
# 08:20 BRT = 11:20 UTC (manhã) | 09:40 BRT = 12:40 UTC (flash)
# 18:00 BRT = 21:00 UTC (fechamento) | 18:05 BRT = 21:05 UTC (números do dia)
on:
  schedule:
    - cron: "20 11 * * 1-5"
    - cron: "40 12 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch:
    inputs:
      etapa:
        description: "manha | flash | fechamento | numeros"
        required: true
        default: "fechamento"

concurrency:
  group: rvlocal-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Definir etapa
        id: etapa
        run: |
          if [ -n "${{ github.event.inputs.etapa }}" ]; then
            echo "nome=${{ github.event.inputs.etapa }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "20 11 * * 1-5") echo "nome=manha" >> "$GITHUB_OUTPUT" ;;
              "40 12 * * 1-5") echo "nome=flash" >> "$GITHUB_OUTPUT" ;;
              "0 21 * * 1-5")  echo "nome=fechamento" >> "$GITHUB_OUTPUT" ;;
              "5 21 * * 1-5")  echo "nome=numeros" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Validar razão
        env: { PYTHONPATH: src }
        run: python -m rvlocal validar
      - name: Executar etapa
        env:
          PYTHONPATH: src
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ steps.etapa.outputs.nome }}" in
            manha|flash|fechamento) python -m rvlocal coletar --modo "${{ steps.etapa.outputs.nome }}" ;;
            numeros) python -m rvlocal fechar ;;
            *) echo "etapa desconhecida"; exit 1 ;;
          esac
      - name: Gravar estado
        run: |
          git config user.name "rv-local-bot"
          git config user.email "rv-local-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "rotina ${{ steps.etapa.outputs.nome }} $(date -u +%F)" && git pull --rebase && git push)
